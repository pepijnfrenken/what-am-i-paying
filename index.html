<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wat betaal ik eigenlijk?</title>
<style>
:root{
  --bg:#E9EFF3; --panel:#F6F8FA; --paper:#FFFFFF;
  --ink:#5A6874; --strong:#46535E; --muted:#8593A0;
  --line:#D3DBE0; --rule:#B8C3C9; --track:#EAEFF2;
  --c-under:#2F7A57; --c-duty:#B5781A; --c-vat:#4F5FB8; --c-tax:#94365A; --focus:#4F5FB8;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
main{max-width:960px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:clamp(1.6rem,4.5vw,2.3rem);line-height:1.1;letter-spacing:-0.02em;margin:0 0 6px;font-weight:700;color:var(--strong)}
.lede{margin:0 0 24px;color:var(--muted);max-width:62ch}
.grid{display:grid;gap:22px;grid-template-columns:1fr}
@media (min-width:820px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:start}}
.controls{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:5px}
.hint{font-size:.78rem;color:var(--muted);margin-top:4px}
select,input[type=number]{width:100%;font:inherit;font-size:1rem;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--strong)}
input[type=number]{font-family:var(--mono)}
select:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--focus)}
.group-title{font-size:.95rem;font-weight:700;margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--line);color:var(--strong)}
.prefix{position:relative}
.prefix span{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-family:var(--mono);color:var(--muted)}
.prefix input{padding-left:26px}
[hidden]{display:none !important}
.receipt-wrap{display:flex;justify-content:center}
.receipt{width:100%;max-width:440px;background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:.9rem;padding:22px 20px 30px;position:relative;
  box-shadow:0 1px 0 rgba(0,0,0,.04),0 12px 30px -18px rgba(20,30,40,.45);
  -webkit-mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 0 0/14px 100% repeat-x;
          mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 0 0/14px 100% repeat-x}
.r-head{text-align:center;margin-bottom:14px}
.r-head strong{display:block;font-size:1rem;font-weight:600;color:var(--strong)}
.r-head small{color:var(--muted)}
.rule{border:0;border-top:1px dashed var(--rule);margin:12px 0}
.line{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.line .lbl{display:flex;gap:8px;align-items:baseline}
.line.sub{padding-left:18px;color:var(--muted);font-size:.82rem}
.line.total{font-weight:600;font-size:1.02rem;color:var(--strong)}
.line.big{font-size:1.25rem;font-weight:600;padding:6px 0;color:var(--strong)}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;flex:none;transform:translateY(-1px)}
.neg{white-space:nowrap}
.bar{display:flex;height:22px;border-radius:3px;overflow:hidden;margin:16px 0 8px;background:var(--track)}
.bar div{height:100%;transition:flex-basis .35s ease}
@media (prefers-reduced-motion:reduce){.bar div{transition:none}}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:.78rem;color:var(--muted)}
.legend span{display:flex;gap:6px;align-items:center}
.take{margin-top:14px;font-family:var(--sans);font-size:.95rem;line-height:1.4;color:var(--ink)}
.take b{font-family:var(--mono)}
.warn{background:#FDF0E0;color:#8A5A22;font-family:var(--sans);font-size:.85rem;padding:8px 10px;border-radius:5px;margin-top:10px}
.heroes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 14px}
.hero{border:1.5px solid var(--line);border-radius:4px;padding:10px 10px 8px;text-align:center}
.hero.real{background:#E9F0EC;color:var(--strong)}
.hero .k{font-family:var(--sans);font-size:.8rem;font-weight:600;display:block}
.hero .v{font-size:1.6rem;font-weight:600;display:block;margin:2px 0}
.hero .d{font-family:var(--sans);font-size:.72rem;opacity:.8;display:block;line-height:1.3}
.mult{text-align:center;font-family:var(--sans);font-size:.95rem;margin:0 0 6px}
.mult b{font-family:var(--mono)}
.notes{margin-top:28px;font-size:.82rem;color:var(--muted);max-width:78ch}
.notes p{margin:0 0 8px}
.countrybar{display:flex;gap:10px;align-items:center;margin:0 0 18px}
.countrybar label{margin:0;font-size:.85rem}
.countrybar select{width:auto;min-width:180px}
.showall-wrap{margin:26px 0 0}
#show-all{font:inherit;font-size:.9rem;font-weight:600;color:var(--strong);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:9px 16px;cursor:pointer}
#show-all:hover{border-color:var(--rule)}
.compare-wrap{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:8px}
table.compare{width:100%;min-width:560px;border-collapse:collapse;background:var(--paper);color:var(--ink);font-size:.85rem}
.compare th{text-align:left;font-size:.78rem;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.compare td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.compare td:first-child{white-space:normal;color:var(--strong);font-weight:600}
.compare th.num,.compare td.num{text-align:right;font-family:var(--mono)}
.compare tbody tr{cursor:pointer}
.compare tbody tr:hover{background:var(--panel)}
.compare tbody tr:last-child td{border-bottom:0}
.tabs{display:flex;gap:6px;margin:0 0 18px;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-size:.9rem;font-weight:600;color:var(--muted);background:transparent;border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;padding:8px 14px;cursor:pointer}
.tab:hover{color:var(--strong)}
.tab.active{color:var(--strong);background:var(--paper);border-color:var(--line);margin-bottom:-1px}
.wheregoes{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;max-width:640px}
.wg-bar{position:relative;display:flex;height:22px;border-radius:3px;overflow:hidden;background:var(--track);margin:8px 0 4px}
.wg-fill{height:100%;background:var(--c-vat)}
.wg-marker{position:absolute;top:-4px;bottom:-4px;right:0;width:2px;background:var(--strong)}
.wg-block{height:100%}
#wg-block-social{background:var(--c-under)}
#wg-block-extra{background:var(--c-tax)}
.wg-block-labels{display:flex;justify-content:space-between;gap:12px;font-size:.8rem;color:var(--muted)}
.wg-block-labels span{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wg-note{font-size:.9rem;color:var(--ink);margin:10px 0 0}
.wg-route{font-size:.9rem;color:var(--ink);margin:12px 0 0}
.wg-legend-title{font-size:.85rem;font-weight:700;margin:16px 0 6px;color:var(--strong)}
.wg-rows{border-top:1px solid var(--line)}
.wg-row{display:flex;justify-content:space-between;gap:12px;padding:6px 2px;border-bottom:1px solid var(--line);font-size:.85rem;color:var(--ink)}
.wg-row .num{font-family:var(--mono)}
.wg-row .pct{color:var(--muted);white-space:nowrap}
.wg-sources,.wg-scope,.wg-disclaimer{font-size:.78rem;color:var(--muted);margin:10px 0 0;max-width:78ch}
.info{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-size:.7rem;font-weight:700;line-height:1;cursor:pointer;padding:0;margin-left:6px;vertical-align:middle;flex:none}
.info:hover,.info[aria-expanded="true"]{border-color:var(--rule);color:var(--strong)}
.info-pop{position:fixed;z-index:40;max-width:320px;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 22px -8px rgba(20,30,40,.35);color:var(--ink);font-size:.82rem;line-height:1.45;padding:10px 12px}
.mult-line{display:flex;gap:4px;align-items:flex-start;justify-content:center;margin:0 0 6px}
.mult-line .mult{margin:0}
.band-lab{display:flex;align-items:center;gap:6px}
.wg-route-line{display:flex;gap:6px;align-items:flex-start;margin:12px 0 0}
.wg-route-line .wg-route{margin:0}
.wg-legend-line{display:flex;align-items:center;gap:6px;margin:16px 0 6px}
.wg-legend-line .wg-legend-title{margin:0}
.showall-head{display:flex;gap:10px;align-items:center}
</style>
</head>
<body>
<main>
  <div class="countrybar">
    <label for="country" id="country-label">Land</label>
    <select id="country"></select>
    <label for="lang" id="lang-label"></label>
    <select id="lang" hidden></select>
  </div>
  <h1 id="title">Wat betaal ik eigenlijk?</h1>
  <p class="lede" id="lede"></p>

  <div class="tabs" role="tablist">
    <button id="tab-receipt" class="tab active" type="button" role="tab" aria-selected="true"></button>
    <button id="tab-where" class="tab" type="button" role="tab" aria-selected="false"></button>
  </div>

  <section id="view-receipt">
  <div class="grid">
    <section class="controls" aria-label="Invoer">
      <div class="field">
        <label for="item" id="item-label">Product</label>
        <select id="item"></select>
        <div class="hint" id="item-hint"></div>
      </div>
      <div class="field">
        <label for="price" id="price-label">Prijs</label>
        <div class="prefix"><span id="price-prefix">&euro;</span><input id="price" type="number" step="0.01" min="0" inputmode="decimal"></div>
        <div class="hint" id="price-hint"></div>
      </div>
      <div class="field">
        <label for="vat" id="vat-label">Btw</label>
        <select id="vat"></select>
      </div>

      <div id="duty-fields">
        <div class="group-title" id="panels-title">Accijns &amp; heffingen</div>
        <div id="panels"></div>
      </div>

      <div class="group-title" id="tax-title">Jouw belasting</div>
      <div class="field">
        <label for="band-tax" class="band-lab"><span id="tax-label"></span><button class="info" type="button" data-info="marginal"></button></label>
        <select id="band-tax"></select>
        <div class="hint" id="tax-hint"></div>
      </div>
      <div class="field" id="custom-rate-wrap" hidden>
        <label for="crate" id="crate-label"></label>
        <input id="crate" type="number" min="0" max="99" step="0.5" value="49.5">
      </div>
    </section>

    <section class="receipt-wrap" aria-live="polite">
      <div class="receipt">
        <div class="r-head"><strong id="r-item"></strong><small id="r-sub"></small></div>
        <div class="heroes">
          <div class="hero real"><span class="k"><span id="r-head-real-label"></span><button class="info" type="button" data-info="wedge"></button></span><span class="v" id="h-real"></span><span class="d" id="h-real-d"></span></div>
          <div class="hero"><span class="k"><span id="r-head-could-label"></span><button class="info" type="button" data-info="could"></button></span><span class="v" id="h-could"></span><span class="d" id="h-could-d"></span></div>
        </div>
        <div class="mult-line"><p class="mult" id="mult"></p><button class="info" type="button" data-info="multiplier"></button></div>
        <hr class="rule">
        <div class="line total"><span id="r-head-price"></span><span id="r-price"></span></div>
        <div class="line"><span class="lbl"><i class="sw" style="background:var(--c-vat)"></i><span id="r-vat-l"></span></span><span class="neg" id="r-vat"></span></div>
        <div class="line"><span class="lbl"><i class="sw" style="background:var(--c-duty)"></i><span id="r-head-duty"></span><button class="info" type="button" data-info="duty"></button></span><span class="neg" id="r-duty"></span></div>
        <div id="r-duty-subs"></div>
        <hr class="rule">
        <div class="line big"><span class="lbl"><i class="sw" style="background:var(--c-under)"></i><span id="r-head-under"></span></span><span id="r-under"></span></div>
        <div class="line sub"><span id="r-under-sub"></span><span></span></div>
        <hr class="rule">
        <div class="line"><span class="lbl"><i class="sw" style="background:var(--c-tax)"></i><span id="r-tax-l"></span></span><span id="r-tax"></span></div>
        <div class="line big"><span id="r-head-gross"></span><span id="r-gross"></span></div>

        <div class="bar" aria-hidden="true">
          <div id="b-under" style="background:var(--c-under)"></div>
          <div id="b-duty" style="background:var(--c-duty)"></div>
          <div id="b-vat" style="background:var(--c-vat)"></div>
          <div id="b-tax" style="background:var(--c-tax)"></div>
        </div>
        <div class="legend">
          <span><i class="sw" style="background:var(--c-under)"></i><span id="l-under"></span> <b id="p-under"></b></span>
          <span><i class="sw" style="background:var(--c-duty)"></i><span id="l-duty"></span> <b id="p-duty"></b></span>
          <span><i class="sw" style="background:var(--c-vat)"></i><span id="l-vat"></span> <b id="p-vat"></b></span>
          <span><i class="sw" style="background:var(--c-tax)"></i><span id="l-tax"></span> <b id="p-tax"></b></span>
        </div>
        <p class="take" id="take"></p>
        <div class="warn" id="warn" hidden></div>
      </div>
    </section>
  </div>

  <div class="showall-wrap">
    <div class="showall-head"><button id="show-all" type="button" hidden></button><button class="info" type="button" data-info="compare"></button></div>
    <div id="compare" hidden></div>
  </div>

  <div class="notes">
    <p><b id="notes-title"></b> <span class="rates"></span></p>
    <p><b id="notes-caveats-title"></b> <span class="caveats"></span></p>
    <p><span class="credit"></span></p>
  </div>
  </section>

  <section id="view-where" hidden>
    <div class="wheregoes">
      <div class="field" id="wg-income-wrap">
        <label for="wg-income" id="wg-label"></label>
        <input id="wg-income" type="number" min="0" step="100" inputmode="numeric">
        <div class="hint" id="wg-default-note"></div>
      </div>
      <div class="field">
        <label class="check"><input id="wg-mode" type="checkbox"><span id="wg-mode-label"></span></label>
      </div>
      <div class="field" id="wg-tax-wrap" hidden>
        <label for="wg-tax" id="wg-tax-label"></label>
        <input id="wg-tax" type="number" min="0" step="100" inputmode="numeric">
      </div>
      <div class="wg-route-line"><p class="wg-route" id="wg-route"></p><button class="info" type="button" data-info="route"></button><button class="info" type="button" data-info="effRate"></button></div>
      <div id="wg-below" hidden>
        <div class="wg-bar"><div class="wg-fill" id="wg-fill"></div><div class="wg-marker"></div></div>
        <div class="wg-block-labels">
          <span id="wg-fill-label"></span>
          <span><span id="wg-baseline-label"></span><button class="info" type="button" data-info="baseline"></button></span>
        </div>
        <p class="wg-note" id="wg-below-text"></p>
      </div>
      <div id="wg-above" hidden>
        <div class="wg-bar stacked">
          <div class="wg-block" id="wg-block-social"></div>
          <div class="wg-block" id="wg-block-extra"></div>
        </div>
        <div class="wg-block-labels">
          <span><span id="wg-social-label"></span><button class="info" type="button" data-info="baseline"></button></span>
          <span id="wg-extra-label"></span>
        </div>
        <div class="wg-legend-line"><h3 class="wg-legend-title" id="wg-legend-title"></h3><button class="info" type="button" data-info="split"></button></div>
        <div class="wg-rows" id="wg-rows"></div>
      </div>
      <p class="wg-sources" id="wg-sources"></p>
      <p class="wg-scope" id="wg-scope"></p>
      <p class="wg-disclaimer" id="wg-disclaimer"></p>
    </div>
  </section>

  <div id="info-pop" class="info-pop" role="tooltip" hidden></div>
</main>

<script src="core.js"></script>
<script src="countries/nl.js"></script>
<script src="countries/uk.js"></script>
<script src="countries/ch.js"></script>
<script src="countries/bg.js"></script>
<script>
  WAIP.mount(new URLSearchParams(location.search).get('c') || 'nl');
</script>
</body>
</html>
